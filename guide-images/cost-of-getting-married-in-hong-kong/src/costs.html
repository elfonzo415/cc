<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap');
/* PRODUCTION: replace the @import above with local @font-face rules, see
   IMAGE-SYSTEM.md section 4. Edge falls back to Segoe UI without it. */
:root{
  --jade:#2E5A4E; --jade-2:#3F776A; --jade-dark:#244A40;
  --cream:#F6F2E9; --cream-2:#EFE9DB;
  --rose:#C7726A; --rose-soft:#F3D8D2; --gold:#E8C48A;
  --ink:#1E1A16; --muted:#6d6459; --line:#E1D8C6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:724px;overflow:hidden;background:var(--cream);
  font-family:'Hanken Grotesk',sans-serif;color:var(--ink)}
.title-font{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.015em;line-height:1.04}

</style>
</head>
<body>

  <svg width="1200" height="724" viewBox="0 0 1200 724">
    <text x="60" y="60" class="title-font" font-size="34" font-weight="700" fill="#244A40">The two bills, side by side</text>
    <text x="60" y="140" font-size="21" font-weight="600" fill="#C7726A" letter-spacing=".06em">PAID TO THE GOVERNMENT, EVERY ROUTE</text>
      <line x1="60" y1="166" x2="1140" y2="166" stroke="#E1D8C6" stroke-width="1" />
      <text x="60" y="206" font-size="24" fill="#1E1A16">Notice of Intended Marriage</text>
      <text x="60" y="234" font-size="20" fill="#6d6459">Form MR1(S), paid once, marry within 3 months</text>
      <text x="1140" y="206" text-anchor="end" class="title-font" font-size="30" font-weight="600" fill="#244A40">HK$305</text><text x="60" y="318" font-size="21" font-weight="600" fill="#C7726A" letter-spacing=".06em">THEN ONE CEREMONY FEE, PICK A ROUTE</text>
      <line x1="60" y1="344" x2="1140" y2="344" stroke="#E1D8C6" stroke-width="1" />
      <text x="60" y="384" font-size="24" fill="#1E1A16">Marriage Registry, weekday or Saturday morning</text>
      
      <text x="1140" y="384" text-anchor="end" class="title-font" font-size="30" font-weight="600" fill="#244A40">HK$715</text>
      <line x1="60" y1="408" x2="1140" y2="408" stroke="#E1D8C6" stroke-width="1" />
      <text x="60" y="448" font-size="24" fill="#1E1A16">Marriage Registry, Saturday afternoon or Sunday</text>
      
      <text x="1140" y="448" text-anchor="end" class="title-font" font-size="30" font-weight="600" fill="#244A40">HK$1,935</text>
      <line x1="60" y1="472" x2="1140" y2="472" stroke="#E1D8C6" stroke-width="1" />
      <text x="60" y="512" font-size="24" fill="#1E1A16">Licensed place of worship</text>
      <text x="60" y="540" font-size="20" fill="#6d6459">set by the church or body, no government ceremony fee</text>
      <text x="1140" y="512" text-anchor="end" class="title-font" font-size="30" font-weight="600" fill="#244A40">varies</text>
      <line x1="60" y1="566" x2="1140" y2="566" stroke="#E1D8C6" stroke-width="1" />
      <text x="60" y="606" font-size="24" fill="#1E1A16">Civil celebrant, anywhere else in Hong Kong</text>
      <text x="60" y="634" font-size="20" fill="#6d6459">no fee fixed by law, agreed privately with the celebrant</text>
      <text x="1140" y="606" text-anchor="end" class="title-font" font-size="30" font-weight="600" fill="#244A40">varies</text>
    <text x="60" y="700" font-size="19" fill="#6d6459">Government fees per the Immigration Department fee leaflet, correct as at September 2026.</text>
  </svg>
</body>
</html>
