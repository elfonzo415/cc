<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap');
/* PRODUCTION: replace the @import above with local @font-face rules, see
   IMAGE-SYSTEM.md section 4. Edge falls back to Segoe UI without it. */
:root{
  --jade:#2E5A4E; --jade-2:#3F776A; --jade-dark:#244A40;
  --cream:#F6F2E9; --cream-2:#EFE9DB;
  --rose:#C7726A; --rose-soft:#F3D8D2; --gold:#E8C48A;
  --ink:#1E1A16; --muted:#6d6459; --line:#E1D8C6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:578px;overflow:hidden;background:var(--cream);
  font-family:'Hanken Grotesk',sans-serif;color:var(--ink)}
.title-font{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.015em;line-height:1.04}

</style>
</head>
<body>

  <svg width="1200" height="578" viewBox="0 0 1200 578">
    <text x="60" y="60" class="title-font" font-size="34" font-weight="700" fill="#244A40">What each route costs, and what you get</text>
    
    <rect x="326" y="96" width="260.6666666666667" height="54" rx="12" fill="#2E5A4E" />
    <text x="456.33333333333337" y="131" text-anchor="middle" class="title-font" font-size="23" font-weight="600" fill="#F6F2E9">Marriage Registry</text>
    <rect x="602.6666666666667" y="96" width="260.6666666666667" height="54" rx="12" fill="#2E5A4E" />
    <text x="733.0000000000001" y="131" text-anchor="middle" class="title-font" font-size="23" font-weight="600" fill="#F6F2E9">Place of worship</text>
    <rect x="879.3333333333334" y="96" width="260.6666666666667" height="54" rx="12" fill="#2E5A4E" />
    <text x="1009.6666666666667" y="131" text-anchor="middle" class="title-font" font-size="23" font-weight="600" fill="#F6F2E9">Civil celebrant</text>
    
    
    <text x="60" y="198" font-size="20" font-weight="600" fill="#1E1A16">Ceremony fee</text>
    <text x="340" y="198" font-size="20" fill="#6d6459">HK$715 or HK$1,935</text><text x="616.6666666666667" y="198" font-size="20" fill="#6d6459">Set by the church</text><text x="893.3333333333334" y="198" font-size="20" fill="#6d6459">Agreed privately</text>
    <line x1="60" y1="220" x2="1140" y2="220" stroke="#E1D8C6" stroke-width="1" />
    <text x="60" y="254" font-size="20" font-weight="600" fill="#1E1A16">Notice fee</text>
    <text x="340" y="254" font-size="20" fill="#6d6459">HK$305</text><text x="616.6666666666667" y="254" font-size="20" fill="#6d6459">HK$305</text><text x="893.3333333333334" y="254" font-size="20" fill="#6d6459">HK$305</text>
    <line x1="60" y1="276" x2="1140" y2="276" stroke="#E1D8C6" stroke-width="1" />
    <text x="60" y="310" font-size="20" font-weight="600" fill="#1E1A16">When</text>
    <text x="340" y="310" font-size="20" fill="#6d6459">The Registry's own</text><text x="340" y="336" font-size="20" fill="#6d6459">slots</text><text x="616.6666666666667" y="310" font-size="20" fill="#6d6459">7am to 7pm, doors</text><text x="616.6666666666667" y="336" font-size="20" fill="#6d6459">open</text><text x="893.3333333333334" y="310" font-size="20" fill="#6d6459">Any hour</text>
    <line x1="60" y1="358" x2="1140" y2="358" stroke="#E1D8C6" stroke-width="1" />
    <text x="60" y="392" font-size="20" font-weight="600" fill="#1E1A16">Where</text>
    <text x="340" y="392" font-size="20" fill="#6d6459">The Registry's hall</text><text x="616.6666666666667" y="392" font-size="20" fill="#6d6459">The licensed building</text><text x="893.3333333333334" y="392" font-size="20" fill="#6d6459">Anywhere else in Hong</text><text x="893.3333333333334" y="418" font-size="20" fill="#6d6459">Kong</text>
    <line x1="60" y1="440" x2="1140" y2="440" stroke="#E1D8C6" stroke-width="1" />
    <text x="60" y="474" font-size="20" font-weight="600" fill="#1E1A16">Who officiates</text>
    <text x="340" y="474" font-size="20" fill="#6d6459">The Registrar</text><text x="616.6666666666667" y="474" font-size="20" fill="#6d6459">A competent minister</text><text x="893.3333333333334" y="474" font-size="20" fill="#6d6459">An appointed</text><text x="893.3333333333334" y="500" font-size="20" fill="#6d6459">celebrant</text>
    <text x="60" y="554" font-size="19" fill="#6d6459">All three routes produce the same legal marriage under the Marriage Ordinance, Cap. 181.</text>
  </svg>
</body>
</html>
