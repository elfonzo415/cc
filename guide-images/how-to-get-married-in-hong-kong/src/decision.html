<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap');
/* PRODUCTION: replace the @import above with local @font-face rules, see
   IMAGE-SYSTEM.md section 4. Edge falls back to Segoe UI without it. */
:root{
  --jade:#2E5A4E; --jade-2:#3F776A; --jade-dark:#244A40;
  --cream:#F6F2E9; --cream-2:#EFE9DB;
  --rose:#C7726A; --rose-soft:#F3D8D2; --gold:#E8C48A;
  --ink:#1E1A16; --muted:#6d6459; --line:#E1D8C6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:620px;overflow:hidden;background:var(--cream);
  font-family:'Hanken Grotesk',sans-serif;color:var(--ink)}
.title-font{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.015em;line-height:1.04}

</style>
</head>
<body>

  <svg width="1200" height="620" viewBox="0 0 1200 620" font-family="Hanken Grotesk, sans-serif">
    <text x="60" y="50" class="title-font" font-size="34" font-weight="700" fill="#244A40">Where can the ceremony take place?</text>
    
  <polygon points="600,95 730,140 600,185 470,140" fill="#F6F2E9" stroke="#2E5A4E" stroke-width="2" />
  <text x="600" y="120" text-anchor="middle" font-size="20" font-weight="600" fill="#1E1A16">Marry at a</text><text x="600" y="146" text-anchor="middle" font-size="20" font-weight="600" fill="#1E1A16">Marriage</text><text x="600" y="172" text-anchor="middle" font-size="20" font-weight="600" fill="#1E1A16">Registry?</text>
    <text x="430" y="210" text-anchor="middle" font-size="21" font-weight="600" fill="#C7726A">Yes</text>
    <text x="770" y="210" text-anchor="middle" font-size="21" font-weight="600" fill="#C7726A">No</text>
    
  <rect x="180" y="300" width="280" height="130" rx="14" fill="#fff" stroke="#E1D8C6" stroke-width="1.5" />
  <text x="196" y="336" font-size="20" fill="#1E1A16">Marriage Registry</text><text x="196" y="362" font-size="20" fill="#1E1A16">HK$715 to HK$1,935,</text><text x="196" y="388" font-size="20" fill="#1E1A16">Registrar</text><text x="196" y="414" font-size="20" fill="#1E1A16">officiates</text>
    
  <polygon points="900,275 1030,320 900,365 770,320" fill="#F6F2E9" stroke="#2E5A4E" stroke-width="2" />
  <text x="900" y="313" text-anchor="middle" font-size="20" font-weight="600" fill="#1E1A16">Licensed place of</text><text x="900" y="339" text-anchor="middle" font-size="20" font-weight="600" fill="#1E1A16">worship?</text>
    
    
      <text x="760" y="400" text-anchor="middle" font-size="21" font-weight="600" fill="#C7726A">Yes</text>
      <text x="1040" y="400" text-anchor="middle" font-size="21" font-weight="600" fill="#C7726A">No, elsewhere</text>
      
  <rect x="640" y="480" width="240" height="130" rx="14" fill="#fff" stroke="#E1D8C6" stroke-width="1.5" />
  <text x="656" y="516" font-size="20" fill="#1E1A16">Licensed place</text><text x="656" y="542" font-size="20" fill="#1E1A16">of worship</text><text x="656" y="568" font-size="20" fill="#1E1A16">Competent</text><text x="656" y="594" font-size="20" fill="#1E1A16">minister, 7am to</text><text x="656" y="620" font-size="20" fill="#1E1A16">7pm</text>
      
  <rect x="920" y="480" width="240" height="130" rx="14" fill="#fff" stroke="#E1D8C6" stroke-width="1.5" />
  <text x="936" y="516" font-size="20" fill="#1E1A16">Any other venue</text><text x="936" y="542" font-size="20" fill="#1E1A16">Civil celebrant,</text><text x="936" y="568" font-size="20" fill="#1E1A16">any hour</text>
    
    <line x1="600" y1="180" x2="430" y2="280" stroke="#E1D8C6" stroke-width="2" />
    <line x1="600" y1="180" x2="770" y2="280" stroke="#E1D8C6" stroke-width="2" />
  </svg>
</body>
</html>
