<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap');
/* PRODUCTION: replace the @import above with local @font-face rules, see
   IMAGE-SYSTEM.md section 4. Edge falls back to Segoe UI without it. */
:root{
  --jade:#2E5A4E; --jade-2:#3F776A; --jade-dark:#244A40;
  --cream:#F6F2E9; --cream-2:#EFE9DB;
  --rose:#C7726A; --rose-soft:#F3D8D2; --gold:#E8C48A;
  --ink:#1E1A16; --muted:#6d6459; --line:#E1D8C6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--cream);
  font-family:'Hanken Grotesk',sans-serif;color:var(--ink)}
.title-font{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.015em;line-height:1.04}

</style>
</head>
<body>

  <svg width="1200" height="630" viewBox="0 0 1200 630">
    <rect width="1200" height="630" fill="#F6F2E9" />
    <rect x="0" y="627" width="1200" height="3" fill="#2E5A4E" />
    <rect x="60" y="60" width="72" height="72" rx="16" fill="#2E5A4E" />
    <path d="M 90.6 86.64 A 10.08 10.08 0 1 0 90.6 105.36" fill="none" stroke="#F6F2E9" stroke-width="2.34" stroke-linecap="round" />
    <path d="M 101.4 105.36 A 10.08 10.08 0 1 0 101.4 86.64" fill="none" stroke="#E8C48A" stroke-width="2.34" stroke-linecap="round" />
    <circle cx="96" cy="96" r="1.62" fill="#C7726A" />
    <text x="600" y="315" text-anchor="middle" class="title-font" font-size="72" font-weight="700" fill="#1E1A16">Fifteen clear days, then you <tspan fill="#C7726A">marry.</tspan></text>
  </svg>
</body>
</html>
