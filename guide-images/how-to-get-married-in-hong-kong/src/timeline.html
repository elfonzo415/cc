<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap');
/* PRODUCTION: replace the @import above with local @font-face rules, see
   IMAGE-SYSTEM.md section 4. Edge falls back to Segoe UI without it. */
:root{
  --jade:#2E5A4E; --jade-2:#3F776A; --jade-dark:#244A40;
  --cream:#F6F2E9; --cream-2:#EFE9DB;
  --rose:#C7726A; --rose-soft:#F3D8D2; --gold:#E8C48A;
  --ink:#1E1A16; --muted:#6d6459; --line:#E1D8C6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:420px;overflow:hidden;background:var(--cream);
  font-family:'Hanken Grotesk',sans-serif;color:var(--ink)}
.title-font{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.015em;line-height:1.04}

</style>
</head>
<body>

  <svg width="1200" height="420" viewBox="0 0 1200 420">
    <text x="90" y="60" class="title-font" font-size="34" font-weight="700" fill="#244A40">From notice to ceremony</text>
    <line x1="90" y1="220" x2="1110" y2="220" stroke="#2E5A4E" stroke-width="4" stroke-linecap="round" />
    
      <circle cx="90" cy="220" r="10" fill="#3F776A" />
      <text x="90" y="174" text-anchor="start" class="title-font"
            font-size="30" font-weight="600" fill="#1E1A16">Notice given</text>
      <text x="90" y="200" text-anchor="start"
            font-size="21" fill="#6d6459">Day 0</text>
      <circle cx="260" cy="220" r="10" fill="#C7726A" />
      <text x="260" y="260" text-anchor="middle" class="title-font"
            font-size="30" font-weight="600" fill="#1E1A16">Earliest marriage</text>
      <text x="260" y="288" text-anchor="middle"
            font-size="21" fill="#6d6459">Day 15, statutory floor</text>
      <circle cx="486.6666666666667" cy="220" r="10" fill="#3F776A" />
      <text x="486.6666666666667" y="174" text-anchor="middle" class="title-font"
            font-size="30" font-weight="600" fill="#1E1A16">Comfortable target</text>
      <text x="486.6666666666667" y="200" text-anchor="middle"
            font-size="21" fill="#6d6459">4 to 6 weeks</text>
      <circle cx="1110" cy="220" r="10" fill="#C7726A" />
      <text x="1110" y="260" text-anchor="end" class="title-font"
            font-size="30" font-weight="600" fill="#1E1A16">Notice expires</text>
      <text x="1110" y="288" text-anchor="end"
            font-size="21" fill="#6d6459">Day 90</text>
    <text x="90" y="396" font-size="19" fill="#6d6459">The 3 month window runs from the date notice was given, not the date the certificate was issued.</text>
  </svg>
</body>
</html>
