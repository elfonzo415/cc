<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap');
/* PRODUCTION: replace the @import above with local @font-face rules, see
   IMAGE-SYSTEM.md section 4. Edge falls back to Segoe UI without it. */
:root{
  --jade:#2E5A4E; --jade-2:#3F776A; --jade-dark:#244A40;
  --cream:#F6F2E9; --cream-2:#EFE9DB;
  --rose:#C7726A; --rose-soft:#F3D8D2; --gold:#E8C48A;
  --ink:#1E1A16; --muted:#6d6459; --line:#E1D8C6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:320px;overflow:hidden;background:var(--cream);
  font-family:'Hanken Grotesk',sans-serif;color:var(--ink)}
.title-font{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.015em;line-height:1.04}

</style>
</head>
<body>

  <svg width="1200" height="320" viewBox="0 0 1200 320">
    <text x="60" y="50" class="title-font" font-size="34" font-weight="700" fill="#244A40">Three steps to marry in Hong Kong</text>
    
      <g>
        <rect x="60" y="90" width="344" height="190" rx="16" fill="#fff" stroke="#E1D8C6" stroke-width="1.5" />
        <circle cx="100" cy="130" r="20" fill="#C7726A" />
        <text x="100" y="138" text-anchor="middle" class="title-font" font-size="22" font-weight="700" fill="#fff">1</text>
        <text x="84" y="185" class="title-font" font-size="28" font-weight="600" fill="#1E1A16">Give notice</text>
        <text x="84" y="215" font-size="22" fill="#6d6459">File the Notice of</text><text x="84" y="243" font-size="22" fill="#6d6459">Intended Marriage,</text><text x="84" y="271" font-size="22" fill="#6d6459">HK$305, directly or</text><text x="84" y="299" font-size="22" fill="#6d6459">through a celebrant.</text>
      </g>
      <g>
        <rect x="428" y="90" width="344" height="190" rx="16" fill="#fff" stroke="#E1D8C6" stroke-width="1.5" />
        <circle cx="468" cy="130" r="20" fill="#C7726A" />
        <text x="468" y="138" text-anchor="middle" class="title-font" font-size="22" font-weight="700" fill="#fff">2</text>
        <text x="452" y="185" class="title-font" font-size="28" font-weight="600" fill="#1E1A16">Wait 15 clear days</text>
        <text x="452" y="215" font-size="22" fill="#6d6459">The statutory floor. 4</text><text x="452" y="243" font-size="22" fill="#6d6459">to 6 weeks is the</text><text x="452" y="271" font-size="22" fill="#6d6459">comfortable target.</text>
      </g>
      <g>
        <rect x="796" y="90" width="344" height="190" rx="16" fill="#fff" stroke="#E1D8C6" stroke-width="1.5" />
        <circle cx="836" cy="130" r="20" fill="#C7726A" />
        <text x="836" y="138" text-anchor="middle" class="title-font" font-size="22" font-weight="700" fill="#fff">3</text>
        <text x="820" y="185" class="title-font" font-size="28" font-weight="600" fill="#1E1A16">Marry within 3 months</text>
        <text x="820" y="215" font-size="22" fill="#6d6459">At a registry, a</text><text x="820" y="243" font-size="22" fill="#6d6459">licensed place of</text><text x="820" y="271" font-size="22" fill="#6d6459">worship, or anywhere</text><text x="820" y="299" font-size="22" fill="#6d6459">else with a celebrant.</text>
      </g>
  </svg>
</body>
</html>
